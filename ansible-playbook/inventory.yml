all:
  hosts:
    k8s-master:
      ansible_host: 192.168.1.60
      ansible_user: master
    k8s-worker1:
      ansible_host: 192.168.1.5
      ansible_user: user
    k8s-worker2:
      ansible_host: 192.168.1.2
      ansible_user: user
    k8s-worker3:
      ansible_host: 192.168.1.3
      ansible_user: user
    k8s-worker4:
      ansible_host: 192.168.1.4
      ansible_user: user
  children:
    kubernetes_nodes:
      hosts:
        k8s-master:
        k8s-worker1:
        k8s-worker2:
        k8s-worker3:
        k8s-worker4:
      vars:
        ansible_become: true
        ansible_become_method: sudo
        ansible_become_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        ansible_ssh_common_args: '-o IdentitiesOnly=yes'
        ansible_ssh_pass: "{{ vault_ssh_pass }}"
        ansible_become_password: "{{ vault_ssh_pass }}"
        ansible_python_interpreter: /usr/bin/python3.12