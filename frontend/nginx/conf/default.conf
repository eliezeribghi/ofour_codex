
        
# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;                        # Écoute les requêtes sur le port 80 (HTTP)
    server_name ofour.link www.ofour.link;  # Définit les noms de domaine acceptés
    server_tokens off;                # Désactive l’affichage de la version Nginx pour des raisons de sécurité

    # Pour le challenge Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {  # Gère les requêtes pour valider le certificat SSL
        root /var/www/certbot;         # Dossier où sont stockées les données pour le challenge
        default_type "text/plain";     # Type de contenu par défaut
        try_files $uri =404;           # Essaie de trouver le fichier, sinon renvoie 404
    }

    # Redirige tout le reste vers HTTPS
    location / {                      # Pour toutes les autres requêtes
        return 301 https://$host$request_uri;  # Redirige avec un statut 301 (permanent) vers HTTPS
    }
}


# use only the first conf 'http' run the comose and run this command,
# docker compose run --rm  certbot certonly --webroot 
# --webroot-path /var/www/certbot/ -d IPv4 publique  -d ofour.link -d www.ofour.link
# add the conf 'https' below 
# and restart the frontend container
# renew 
# docker compose run --rm certbot renew



server {
    listen 443 ssl;                 # Écoute les requêtes sécurisées sur le port 443 (IPv4)
    listen [::]:443 ssl;            # Écoute aussi sur IPv6
    server_name ofour.link www.ofour.link;  # Domaines acceptés

    ssl_certificate /etc/nginx/ssl/live/ofour.link-0001/fullchain.pem;  # Chemin du certificat SSL
    ssl_certificate_key /etc/nginx/ssl/live/ofour.link-0001/privkey.pem;  # Clé privée associée

    ssl_protocols TLSv1.2 TLSv1.3;  # Versions de protocole SSL/TLS supportées (sécurisées)
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';  # Chiffrements forts
    ssl_prefer_server_ciphers on;   # Privilégie les chiffrements du serveur

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;  # Force HTTPS pour 1 an
    add_header X-Content-Type-Options "nosniff";  # Empêche le sniffing de type MIME
    add_header X-Frame-Options "DENY";            # Bloque l’embedding dans des frames
    add_header X-XSS-Protection "1; mode=block";  # Protège contre les attaques XSS

    # Location pour certbot challenge (pour renouvellement)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;      # Même dossier que pour le challenge initial
    }

    # Frontend static files
    location / {
        root /usr/share/nginx/html;  # Dossier des fichiers statiques du frontend
        try_files $uri /index.html;  # Essaie de trouver le fichier, sinon renvoie index.html (SPA)
    }
    location /images/ {
        root /usr/share/nginx/html;  # Dossier pour les images
        access_log off;             # Désactive les logs pour les images (optimisation)
    }

    # PHP Backend API
    location /api/ {
        proxy_pass http://backend_container:8000;  # Redirige les requêtes /api/ vers le backend
        proxy_set_header Host $host;              # Transmet l’hôte
        proxy_set_header X-Real-IP $remote_addr;  # Transmet l’IP du client
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Transmet la chaîne des proxys
        proxy_set_header X-Forwarded-Proto $scheme;  # Transmet le protocole (http/https)
    }

    # Static fallback
    location @static {
        root /usr/share/nginx/html;  # Fallback pour les fichiers statiques
        try_files $uri /index.html;  # Même logique que location /
    }
}

