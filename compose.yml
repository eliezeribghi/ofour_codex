

services:
  frontend:
    build: ./frontend
    container_name: frontend_container
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot-www:/var/www/certbot
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - front-network
    depends_on:
      - backend



  backend:
    build: ./backend
    container_name: backend_container
    restart: always
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    env_file:
      - ./backend/.env
    
    volumes:
      - ./backend:/app
    networks:
      - db-network
      - front-network
    depends_on:
      mysql:
        condition: service_healthy
 
  adminer:
    image: adminer
    container_name: adminer
    restart: always
    
    ports:
      - 8080:8080
    networks:
      - db-network
    env_file:
      - path: ./backend/.env
  
    depends_on:
      - mysql
  mysql:
    image: mysql:9.2
    container_name: mysql_db
    ports:
      - "3306:3306"
    env_file:
      - path: ./backend/.env
   
    volumes:
      - ./bdd/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    
    networks:
      - db-network
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"] # command to run
        interval: 10s # Frequency every 10 seconds
        timeout: 5s # if no response after 5s the test is considred failed 
        retries: 5 # 5 retries before considering the test failed 
        start_period: 30s


  prometheus:
    image: prom/prometheus
    container_name: prometheus

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9089:9090/tcp"
   
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
 
    depends_on:
      - cadvisor
    networks:
    - monitoring-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - 8079:8080
    
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    - /dev/zfs:/dev/zfs
    networks:
    - monitoring-network
    

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    expose:
      - 9100
    networks:
    - monitoring-network


  grafana:
    image: grafana/grafana
    container_name: grafana
    # user: "0"
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
    volumes:
      - ./grafana-volume:/var/lib/grafana
    
    depends_on:
      - prometheus
      - cadvisor
    networks:
    - monitoring-network


  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot -d ofour.link --email iibgui@yahoo.fr --agree-tos --non-interactive --debug
    networks:
      - front-network



   

volumes:
  db_data:
networks:
  db-network:
  front-network:
  monitoring-network:
